name: Compilar Workxit Jiu para Appetize

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Gerar projeto Xcode
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Compilar para iOS Simulator
        run: |
          xcodebuild -project WorkxitJiuMobile.xcodeproj \
            -scheme WorkxitJiuMobile -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/workxit-build" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Empacotar aplicativo
        run: |
          app="$RUNNER_TEMP/workxit-build/Build/Products/Debug-iphonesimulator/WorkxitJiuMobile.app"
          test -f "$app/Info.plist"
          ditto -c -k --keepParent "$app" Workxit-Jiu-Appetize.zip
          unzip -t Workxit-Jiu-Appetize.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Workxit-Jiu-Build-iOS-Simulator
          path: Workxit-Jiu-Appetize.zip
          if-no-files-found: error
